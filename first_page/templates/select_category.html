{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Select Category For Quiz</title>
    <link rel="stylesheet" href="{% static 'category.css' %}">
</head>
<body>
    <div class="container">
        <h1>Select Category For Quiz</h1>
        <form method="post">
            {% csrf_token %}
            <select name="category" required>
                <option value="" disabled selected>Choose a category</option>
                {% for cat in categories %}
                    <option value="{{ cat }}">{{ cat }}</option>
                {% endfor %}
            </select>
            <button type="submit">Submit</button>
        </form>

        {% if selected %}
            <p class="result">You selected: <strong>{{ selected }}</strong></p>
        {% endif %}
    </div>
</body>
</html>
